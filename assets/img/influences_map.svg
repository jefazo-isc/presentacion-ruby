<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="460" height="360">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <marker id="inArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#fb7185"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="456" height="356" rx="14" fill="#090e18" stroke="#fb7185" stroke-opacity="0.28" stroke-width="1.5"/>
  <rect x="2" y="2" width="456" height="356" rx="14" fill="url(#centerGlow)"/>

  <text x="230" y="28" text-anchor="middle" fill="#fda4af" font-family="Inter, sans-serif" font-size="13" font-weight="800" letter-spacing="0.8">INFLUENCIAS DE DISEÑO DE RUBY (MATZ, 1993-1995)</text>

  <!-- Líneas convergentes hacia el centro (230, 195) -->
  <line x1="115" y1="86" x2="188" y2="162" stroke="#fb7185" stroke-width="2" stroke-opacity="0.7" marker-end="url(#inArrow)"/>
  <line x1="345" y1="86" x2="272" y2="162" stroke="#fb7185" stroke-width="2" stroke-opacity="0.7" marker-end="url(#inArrow)"/>
  <line x1="95" y1="200" x2="170" y2="195" stroke="#fb7185" stroke-width="2" stroke-opacity="0.7" marker-end="url(#inArrow)"/>
  <line x1="365" y1="200" x2="290" y2="195" stroke="#fb7185" stroke-width="2" stroke-opacity="0.7" marker-end="url(#inArrow)"/>
  <line x1="230" y1="296" x2="230" y2="242" stroke="#fb7185" stroke-width="2" stroke-opacity="0.7" marker-end="url(#inArrow)"/>

  <!-- Centro: RUBY -->
  <circle cx="230" cy="195" r="48" fill="#be123c" fill-opacity="0.35" stroke="#ff4d6d" stroke-width="2.5"/>
  <polygon points="212,175 248,175 258,190 230,220 202,190" fill="#e11d48" stroke="#fda4af" stroke-width="1.5"/>
  <polygon points="212,175 248,175 230,190" fill="#fb7185" fill-opacity="0.7"/>
  <text x="230" y="234" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="900">RUBY</text>

  <!-- Nodo 1: Smalltalk -->
  <rect x="26" y="48" width="166" height="52" rx="10" fill="#131c2e" stroke="#38bdf8" stroke-width="1.4"/>
  <text x="109" y="70" text-anchor="middle" fill="#7dd3fc" font-family="Inter, sans-serif" font-size="13.5" font-weight="800">Smalltalk</text>
  <text x="109" y="88" text-anchor="middle" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10.5">Todo es objeto y mensajes</text>

  <!-- Nodo 2: Perl -->
  <rect x="268" y="48" width="166" height="52" rx="10" fill="#131c2e" stroke="#34d399" stroke-width="1.4"/>
  <text x="351" y="70" text-anchor="middle" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="13.5" font-weight="800">Perl</text>
  <text x="351" y="88" text-anchor="middle" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10.5">Sigils, regex e inmediatez</text>

  <!-- Nodo 3: Eiffel -->
  <rect x="16" y="172" width="136" height="54" rx="10" fill="#131c2e" stroke="#fbbf24" stroke-width="1.4"/>
  <text x="84" y="195" text-anchor="middle" fill="#fde68a" font-family="Inter, sans-serif" font-size="13.5" font-weight="800">Eiffel</text>
  <text x="84" y="213" text-anchor="middle" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10.5">Sintaxis limpia y clara</text>

  <!-- Nodo 4: Ada -->
  <rect x="308" y="172" width="136" height="54" rx="10" fill="#131c2e" stroke="#a855f7" stroke-width="1.4"/>
  <text x="376" y="195" text-anchor="middle" fill="#d8b4fe" font-family="Inter, sans-serif" font-size="13.5" font-weight="800">Ada</text>
  <text x="376" y="213" text-anchor="middle" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10.5">Bloques legibles (end)</text>

  <!-- Nodo 5: Lisp -->
