  <text x="230" y="316" text-anchor="middle" fill="#fda4af" font-family="Inter, sans-serif" font-size="13.5" font-weight="800">Lisp</text>
  <text x="230" y="333" text-anchor="middle" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10.5">Closures, lambdas y bloques</text>
