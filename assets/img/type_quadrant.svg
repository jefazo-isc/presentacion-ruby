<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="460" height="360">
  <rect x="2" y="2" width="456" height="356" rx="14" fill="#0b101b" stroke="#334155" stroke-width="1.5"/>

  <text x="230" y="28" text-anchor="middle" fill="#f8fafc" font-family="Inter, sans-serif" font-size="14" font-weight="800">CUADRANTE DE SISTEMAS DE TIPOS</text>

  <!-- Ejes -->
  <line x1="230" y1="54" x2="230" y2="316" stroke="#475569" stroke-width="2"/>
  <line x1="42" y1="185" x2="418" y2="185" stroke="#475569" stroke-width="2"/>

  <!-- Etiquetas de los ejes -->
  <text x="230" y="47" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="11.5" font-weight="800">TIPADO FUERTE (Sin coerción implícita)</text>
  <text x="230" y="336" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="11.5" font-weight="800">TIPADO DÉBIL (Conversión automática)</text>
  <text x="22" y="185" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11.5" font-weight="800" transform="rotate(-90 22 185)">ESTÁTICO (Compilación)</text>
  <text x="438" y="185" text-anchor="middle" fill="#fb7185" font-family="Inter, sans-serif" font-size="11.5" font-weight="800" transform="rotate(90 438 185)">DINÁMICO (Ejecución)</text>

  <!-- Cuadrante Estático + Fuerte -->
  <rect x="52" y="64" width="166" height="110" rx="10" fill="#1e293b" fill-opacity="0.55" stroke="#38bdf8" stroke-opacity="0.4"/>
  <text x="135" y="90" text-anchor="middle" fill="#bae6fd" font-family="Inter, sans-serif" font-size="13" font-weight="700">Java · Rust · Go</text>
  <text x="135" y="112" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Tipos fijos en variable</text>
  <text x="135" y="132" text-anchor="middle" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="10.5">int x = 5;</text>
  <text x="135" y="156" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Error antes de correr</text>

  <!-- Cuadrante Dinámico + Fuerte (RUBY!) -->
  <rect x="242" y="64" width="166" height="110" rx="10" fill="#9f1239" fill-opacity="0.32" stroke="#ff4d6d" stroke-width="2"/>
  <rect x="292" y="72" width="66" height="22" rx="11" fill="#e11d48"/>
  <text x="325" y="87" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="900">RUBY</text>
  <text x="325" y="110" text-anchor="middle" fill="#fda4af" font-family="Inter, sans-serif" font-size="12" font-weight="700">y Python</text>
  <text x="325" y="132" text-anchor="middle" fill="#fecdd3" font-family="JetBrains Mono, monospace" font-size="10.5">"5" + 5 → TypeError</text>
  <text x="325" y="156" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="10">El valor tiene el tipo</text>

  <!-- Cuadrante Estático + Débil -->
  <rect x="52" y="196" width="166" height="110" rx="10" fill="#1e293b" fill-opacity="0.4" stroke="#475569" stroke-opacity="0.6"/>
  <text x="135" y="224" text-anchor="middle" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13" font-weight="700">C · C++</text>
  <text x="135" y="248" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Casteos implícitos</text>
  <text x="135" y="270" text-anchor="middle" fill="#fde68a" font-family="JetBrains Mono, monospace" font-size="10.5">'a' + 1 → 98</text>
  <text x="135" y="292" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Acceso cercano a bytes</text>

  <!-- Cuadrante Dinámico + Débil -->
  <rect x="242" y="196" width="166" height="110" rx="10" fill="#1e293b" fill-opacity="0.4" stroke="#fbbf24" stroke-opacity="0.35"/>
  <text x="325" y="224" text-anchor="middle" fill="#fde68a" font-family="Inter, sans-serif" font-size="13" font-weight="700">JavaScript · Perl · PHP</text>
  <text x="325" y="248" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Coerción automática</text>
  <text x="325" y="270" text-anchor="middle" fill="#fde68a" font-family="JetBrains Mono, monospace" font-size="10.5">"5" + 5 → "55"</text>
  <text x="325" y="292" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Menos estricto en runtime</text>
</svg>
